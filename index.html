<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a poll | Otter Poll</title>
    <meta name="description" content="Join a classroom poll with the code your instructor is showing." />
    <meta name="theme-color" content="#31456b" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Open connections to Google's servers early. The poll data and the sign-in step use them. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <script>
      // Starts fetching the poll at once, before the styles and scripts have loaded,
      // so the first question can show as early as possible. js/participant.js picks
      // up the result. The project id and key repeat the values in js/config.js.
      (function () {
        try {
          var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
          if (code.length !== 6) return;
          // A device that has already answered this poll loads its own answers the regular way.
          if (JSON.parse(localStorage.getItem('otter-poll:joined') || '[]').indexOf(code) !== -1) return;
          var url = 'https://firestore.googleapis.com/v1/projects/otter-poll/databases/(default)/documents/sessions/' + code + '?key=AIzaSyDOkvYyu1DyULufkfzpNI5b4XDifCVQWt0';
          var session = fetch(url).then(function (response) {
            if (response.status === 404) return null;
            if (!response.ok) throw new Error('status ' + response.status);
            return response.json();
          });
          session.catch(function () {});
          window.__otterEarly = { code: code, session: session };
        } catch (e) {
          // If anything here fails, the page loads the poll the regular way.
        }
      })();
    </script>
    <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css?v=20261113155639" />

          "./js/util.js": "./js/util.js?v=20261113155639"
        }
      }
    </script>

    <link rel="modulepreload" href="js/participant.bundle.js?v=20261113155639" />
    <!-- The larger Firebase code, fetched in the background for sending answers and live updates. -->

    <link rel="modulepreload" href="js/util.js?v=20261113155639" fetchpriority="low" />
